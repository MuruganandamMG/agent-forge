[project]
name = "local-coding-agent"
version = "0.1.0"
description = "CLI agentic coding assistant for RTX 4060"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "chromadb>=1.0.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.black]
line-length = 99

[tool.ruff]
line-length = 99
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
